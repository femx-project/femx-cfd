format: femx-cfd-forward
version: 3

output:
  directory: result
  every: 1

mesh:
  path: mesh.msh
  length_unit: mm

fluid:
  rho: 1000.0
  mu: 0.004

time:
  dt: 0.25
  end_time: 0.5

solver:
  platform: cpu
  backend: petsc

boundary_conditions:
  - boundary: inlet
    kind: velocity
    source: analytic
    normal: auto
    profile:
      kind: uniform
      value: 0.1
    waveform:
      kind: uniform
      value: 1.0
  - boundary: wall
    kind: velocity
    source: analytic
    value: [0.0, 0.0]
  - boundary: outlet
    kind: pressure
    source: analytic
    value: 0.0
