format: femx-cfd-forward
version: 1

mesh:
  path: mesh.msh
  length_unit: mm

fluid:
  rho: 1000.0
  mu: 0.004

time:
  dt: 0.25
  end_time: 0.5

inlet:
  boundary: inlet
  normal: auto
  profile:
    kind: uniform
    value: 0.1
  waveform:
    kind: uniform
    value: 1.0

boundary_conditions:
  - boundary: wall
    kind: no_slip
  - boundary: outlet
    kind: pressure
    value: 0.0
