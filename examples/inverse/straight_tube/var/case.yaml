format: femx-cfd-inverse
version: 3
method: var

output:
  directory: result
  every: 1

mesh:
  path: ../mesh/mesh.msh
  length_unit: m

fluid:
  rho: 1.0
  mu: 0.01

time:
  period: 1.0
  dt: 0.25
  end_time: 1.0

solver:
  platform: cpu
  backend: petsc

control:
  boundary: inlet
  kind: vector

boundary_conditions:
- boundary: wall
  kind: velocity
  value: [0.0, 0.0]
- boundary: outlet
  kind: pressure
  value: 0.0

observations:
  kind: velocity
  path: ../observation/velocity.h5

initialization:
  inlet:
    source: file
    path: ../inlet/initial_velocity.h5

algorithm:
  optimizer: scipy
  max_iterations: 3
  gradient_tolerance: 0.001
  function_tolerance: 1.0e-12
  control_bounds:
  - -0.2
  - 0.2
  regularization:
    background: 0.01
    space: 0.001
    time: 0.01
