format: femx-cfd-inverse
version: 3
method: envar

output:
  directory: result
  every: 1

mesh:
  path: ../mesh/mesh.msh
  length_unit: m

fluid:
  rho: 1.0
  mu: 0.01

time:
  period: 1.0
  dt: 0.25
  end_time: 1.0

solver:
  platform: cpu
  backend: petsc

control:
  boundary: inlet
  kind: vector

boundary_conditions:
- boundary: wall
  kind: velocity
  value: [0.0, 0.0]
- boundary: outlet
  kind: pressure
  value: 0.0

observations:
  kind: velocity
  path: ../observation/velocity.h5

initialization:
  inlet:
    source: file
    path: ../inlet/initial_velocity.h5

algorithm:
  prior_weight: 0.25
  outer_iterations: 2

ensemble:
  workers: 1
  modes:
    spatial:
      uniform:
        kind: uniform
    temporal:
      mean:
        kind: constant
      sin1:
        kind: sine
        order: 1
    combined:
    - name: flow_mean
      spatial: uniform
      temporal: mean
      scale: 0.2
    - name: flow_sin1
      spatial: uniform
      temporal: sin1
      scale: 0.2
