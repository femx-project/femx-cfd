[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femx-cfd"
version = "0.2.0"
description = "Python CFD forward, forecasting, and data-assimilation applications for femx."
requires-python = ">=3.9"
dependencies = [
    "femx>=0.2.0,<0.3.0",
    "gmsh>=4.11",
    "h5py>=3.8",
    "hydra-core>=1.3.4,<1.4",
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.scripts]
femx-var-demo = "apps.demo.main:var_main"
femx-envar-demo = "apps.demo.main:envar_main"
femx-forward = "apps.forward.main:main"
femx-mesh = "apps.mesh.main:main"
femx-prepare = "apps.prepare.main:main"
femx-inlet = "apps.inlet.main:main"
femx-envar = "apps.envar.main:main"
femx-var = "apps.var.main:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools]
packages = [
    "femx_cfd",
    "femx_cfd.models",
    "femx_cfd.models.navier_stokes",
    "femx_cfd.mesh",
    "femx_cfd.prep",
    "apps",
    "apps.common",
    "apps.demo",
    "apps.envar",
    "apps.forward",
    "apps.inlet",
    "apps.mesh",
    "apps.prepare",
    "apps.var",
    "configs",
]

[tool.setuptools.package-data]
configs = ["*.yaml", "demo/*.yaml", "synthetic/*.yaml", "vesselA/*.yaml"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
