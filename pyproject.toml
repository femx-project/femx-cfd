[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femx-cfd"
version = "0.5.2"
description = "Python CFD forward, forecasting, and data-assimilation applications for femx."
requires-python = ">=3.9"
dependencies = [
    "femx>=0.6.0,<0.8.0",
    "gmsh>=4.11",
    "h5py>=3.8",
    "numpy>=1.23",
    "PyYAML>=6",
    "scipy>=1.9",
    "threadpoolctl>=3.1",
]

[project.scripts]
femx-cfd = "femx_cfd.cli:main"

[project.optional-dependencies]
lint = [
    "ruff==0.15.22",
]
test = [
    "pytest>=8",
]

[tool.setuptools]
packages = [
    "femx_cfd",
    "femx_cfd.cases",
    "femx_cfd.cases.migrations",
    "femx_cfd.da",
    "femx_cfd.examples",
    "femx_cfd.models",
    "femx_cfd.models.navier_stokes",
    "femx_cfd.mesh",
    "femx_cfd.prep",
    "femx_cfd.runtime",
    "femx_cfd.workflows",
]

[tool.setuptools.package-dir]
# Keep user-facing sources at the repository root while installing them as
# package resources for the public example command.
"femx_cfd.examples" = "examples"

[tool.setuptools.package-data]
"femx_cfd.examples" = [
    "index.yaml",
    "*/*/*.yaml",
    "*/*/*/*.yaml",
    "*/*/*.msh",
    "*/*/*/*.msh",
    "*/*/*.h5",
    "*/*/*/*.h5",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
