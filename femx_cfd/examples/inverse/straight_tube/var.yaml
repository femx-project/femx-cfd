format: femx-cfd-inverse
version: 1
method: var
mesh:
  path: mesh.msh
  length_unit: m
fluid:
  rho: 1.0
  mu: 0.01
time:
  period: 1.0
  dt: 0.25
  end_time: 1.0
control:
  boundary: inlet
  kind: normal
boundary_conditions:
- boundary: wall
  kind: no_slip
- boundary: outlet
  kind: pressure
  value: 0.0
observations:
  kind: velocity
  path: observations.h5
initialization:
  inlet:
    source: file
    path: initial_inlet.h5
solver:
  backend: dense
algorithm:
  optimizer: scipy
  max_iterations: 3
  gradient_tolerance: 0.001
  function_tolerance: 1.0e-12
  control_bounds:
  - 0.0
  - 0.2
  regularization:
    background: 0.01
    space: 0.001
    time: 0.01
