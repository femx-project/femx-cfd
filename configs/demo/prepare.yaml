# @package case

defaults:
  - /runtime@_global_
  - /demo/common@_here_
  - _self_

job: prepare
source: synthetic
input: ${case.prepared}/truth_inlet.h5
velocity: ${case.prepared}/velocity.h5
truth: ${case.prepared}/truth.h5

control:
  boundary: inlet
  kind: normal

bc:
  - boundary: wall
    field: velocity
    components: all
    space:
      kind: uniform
      value: [0.0, 0.0]
    time:
      kind: uniform
  - boundary: outlet
    field: pressure
    space:
      kind: uniform
      value: 0.0
    time:
      kind: uniform

fluid:
  rho: 1.0
  mu: 0.01

time:
  T: 1.0
  dt: 0.05

simulation:
  # Run one spin-up cycle and sample the second cycle.
  end_time: 2.0

solver:
  backend: petsc
  petsc_options: -ksp_type fgmres -pc_type bjacobi -sub_pc_type ilu -ksp_rtol 1e-8

observation:
  lower: [-1.75, -0.4]
  upper: [1.75, 0.4]
  counts: [8, 5]
  phases: 10
