# @package case

defaults:
  - /runtime@_global_
  - /demo/common@_here_
  - _self_

job: var
velocity: ${case.prepared}/velocity.h5
inlet_file: ${case.prepared}/inlet.h5

control:
  boundary: inlet
  kind: normal

bc:
  - boundary: wall
    field: velocity
    components: all
    space:
      kind: uniform
      value: [0.0, 0.0]
    time:
      kind: uniform
  - boundary: outlet
    field: pressure
    space:
      kind: uniform
      value: 0.0
    time:
      kind: uniform

fluid:
  rho: 1.0
  mu: 0.01

time:
  T: 1.0
  dt: 0.05

simulation:
  end_time: ${case.time.T}

solver:
  backend: petsc
  petsc_options: -ksp_type fgmres -pc_type bjacobi -sub_pc_type ilu -ksp_rtol 1e-8

var:
  overwrite: true
  optimizer: tao
  max_iterations: 10
  gradient_tolerance: 0.001
  function_tolerance: 1e-12
  control_bounds: [0.0, 2.0]
  regularization:
    background: 0.01
    space: 0.001
    time: 0.01
