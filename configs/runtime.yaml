# @package _global_

defaults:
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    # Applications manage stable output paths themselves.
    dir: ${hydra:runtime.cwd}
  sweep:
    dir: ${hydra:runtime.cwd}/run/${case.id}/${case.job}/sweep
    subdir: ${hydra.job.num}
  job:
    chdir: false
