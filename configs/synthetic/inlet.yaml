# @package case

defaults:
  - /runtime@_global_
  - /synthetic/common@_here_
  - _self_

job: inlet

time:
  T: 0.48

control:
  boundary: inlet
  kind: normal
  normal: auto

inlet:
  source: velocity
  file: ${case.prepared}/velocity.h5
  output: ${case.prepared}/inlet.h5
  T: ${case.time.T}
  projection:
    depth: 0.000375
    axial_decay: 0.00025
    laplacian_modes: 3
    ridge: 0.001
