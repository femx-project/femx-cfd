# @package case

defaults:
  - /runtime@_global_
  - /synthetic/common@_here_
  - _self_

job: prepare
source: synthetic
input: ${case.prepared}/truth_inlet.h5
velocity: ${case.prepared}/velocity.h5
truth: ${case.prepared}/truth.h5

control:
  boundary: inlet
  kind: normal

bc:
  - boundary: wall
    field: velocity
    components: all
    space:
      kind: uniform
      value: [0.0, 0.0]
    time:
      kind: uniform
  - boundary: outlet
    field: pressure
    space:
      kind: uniform
      value: 0.0
    time:
      kind: uniform

# Re = rho U_ave D / mu = 240 for U_ave = 0.2 m/s and D = 4 mm.
fluid:
  rho: 1050.0
  mu: 0.0035

time:
  T: 0.48
  dt: 0.0002

simulation:
  end_time: 1.92

solver:
  backend: petsc
  petsc_options: -ksp_type fgmres -pc_type bjacobi -sub_pc_type ilu -ksp_rtol 1e-8

observation:
  # 0.5 mm spacing, half a voxel inside the boundary.
  lower: [-0.00475, -0.00175]
  upper: [0.00475, 0.00175]
  counts: [20, 8]
  phases: 10

noise:
  small:
    output: ${case.prepared}/velocity_noise_small.h5
    std: 0.03
    seed: 20260715
  large:
    output: ${case.prepared}/velocity_noise_large.h5
    std: 0.10
    seed: 20260716
