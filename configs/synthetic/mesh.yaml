# @package case

defaults:
  - /runtime@_global_
  - _self_

id: straight-tube
job: mesh

mesh:
  generator: straight_tube_2d
  output: ${hydra:runtime.cwd}/data/meshes/demo/2d_rectangle.msh
  # SI units: 10 mm long, 4 mm diameter, and 0.2 mm CFD cells.
  length: 0.01
  diameter: 0.004
  cell_size: 0.0002
  overwrite: false
